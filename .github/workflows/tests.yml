name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one failing combination must not hide results from the others
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Note: if GitHub removes Python 3.9 from a runner image, change "3.9" to "3.10" here.
        python-version: ["3.9", "3.12"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the unit tests (offline)
        run: python -m unittest discover -s tests -t . -v

      - name: Run the end-to-end demo on the fake sample data
        run: python demo.py --output-dir demo_output
